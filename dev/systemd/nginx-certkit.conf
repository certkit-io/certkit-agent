server {
  listen 443 ssl;
  server_name systemd.nginx.certkit.io www.systemd.nginx.certkit.io;

  ssl_certificate /etc/nginx/ssl/certkit.crt;
  ssl_certificate_key /etc/nginx/ssl/certkit.key;

  location / {
    add_header Content-Type text/plain;
    return 200 "This is nginx running on a docker container with systemd";
  }
}
