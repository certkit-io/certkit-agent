name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  # Builds all raw binaries (linux/amd64, linux/arm64, windows/amd64).
  # Checksums are NOT generated here: signing in package-windows changes the
  # bytes, so the release job computes them over the final files.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build artifacts
        run: ./scripts/build.sh
        env:
          SKIP_CHECKSUMS: "1"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/bin/*
          if-no-files-found: error

  # Signs the windows exe (when enabled), builds the MSI around it, signs the
  # MSI, and smoke-tests an install/uninstall cycle on the runner.
  package-windows:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: read
      id-token: write # OIDC for Azure Trusted Signing (unused while signing is disabled)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/bin

      - name: Compute MSI version
        id: version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          if ($ver -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tag '${{ github.ref_name }}' does not produce a valid MSI ProductVersion (need vMAJOR.MINOR.PATCH)"
          }
          "version=$ver" >> $env:GITHUB_OUTPUT

      # ------------------------------------------------------------------
      # Code signing - PLACEHOLDER, disabled until a signing provider is
      # onboarded (see MSI-PLAN.md section 2). To enable Azure Trusted
      # Signing:
      #   1. Create the Trusted Signing account + certificate profile in
      #      Azure, and an Entra app registration with a federated credential
      #      for this repo (OIDC - no stored secret).
      #   2. Set repo secrets  AZURE_TENANT_ID, AZURE_CLIENT_ID
      #      and repo variables TRUSTED_SIGNING_ENDPOINT (e.g.
      #      https://eus.codesigning.azure.net/), TRUSTED_SIGNING_ACCOUNT,
      #      TRUSTED_SIGNING_PROFILE.
      #   3. Set repo variable ENABLE_CODE_SIGNING = "true".
      # TODO: confirm the latest azure/trusted-signing-action version when
      # enabling.
      # ------------------------------------------------------------------
      - name: Azure login (OIDC, for Trusted Signing)
        if: vars.ENABLE_CODE_SIGNING == 'true'
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          allow-no-subscriptions: true

      - name: Sign windows binary
        if: vars.ENABLE_CODE_SIGNING == 'true'
        uses: azure/trusted-signing-action@v5
        with:
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: dist\bin
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install WiX
        shell: pwsh
        run: |
          # Pinned to v6: WiX v7 requires accepting the Open Source
          # Maintenance Fee EULA, which would gate CI (see MSI-PLAN.md).
          dotnet tool install --global wix --version 6.0.2
          wix extension add -g WixToolset.Util.wixext/6.0.2
          wix extension add -g WixToolset.UI.wixext/6.0.2

      - name: Build MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\msi | Out-Null
          wix build packaging\windows\Package.wxs packaging\windows\CertKitUI.wxs `
            -arch x64 `
            -d Version=${{ steps.version.outputs.version }} `
            -d AgentExe=dist\bin\certkit-agent_windows_amd64.exe `
            -ext WixToolset.Util.wixext `
            -ext WixToolset.UI.wixext `
            -o dist\msi\certkit-agent_windows_amd64.msi
          if ($LASTEXITCODE -ne 0) { throw "wix build failed" }

      - name: Sign MSI
        if: vars.ENABLE_CODE_SIGNING == 'true'
        uses: azure/trusted-signing-action@v5
        with:
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: dist\msi
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Smoke test MSI
        shell: pwsh
        run: |
          # Pre-seed a config so BootstrapConfig does not require a
          # registration key. The service starts but then exits (no valid
          # registration is possible from CI), so assert existence rather
          # than a Running state.
          $cfgDir = "C:\ProgramData\CertKit\certkit-agent"
          New-Item -ItemType Directory -Force $cfgDir | Out-Null
          '{"api_base":"https://app.certkit.io"}' | Set-Content -Encoding ascii "$cfgDir\config.json"

          $msi = (Resolve-Path "dist\msi\certkit-agent_windows_amd64.msi").Path
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart', '/l*v', 'msi-install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI install failed with exit code $($p.ExitCode)" }

          if (-not (Get-Service certkit-agent -ErrorAction SilentlyContinue)) { throw "service was not created" }
          $arp = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall' |
            Where-Object { (Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue).DisplayName -eq 'CertKit Agent' }
          if (-not $arp) { throw "Add/Remove Programs entry missing" }
          $src = 'HKLM:\SYSTEM\CurrentControlSet\Services\EventLog\Application\CertKit'
          if (-not (Test-Path $src)) { throw "event log source missing" }

          # Quiesce the (crash-looping, unregistered) service so SCM recovery
          # cannot race the uninstall's cleanup.
          sc.exe failure certkit-agent reset= 0 actions= "" | Out-Null
          Stop-Service certkit-agent -Force -ErrorAction SilentlyContinue

          $p = Start-Process msiexec.exe -ArgumentList '/x', "`"$msi`"", '/qn', '/norestart', '/l*v', 'msi-uninstall.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI uninstall failed with exit code $($p.ExitCode)" }

          if (Get-Service certkit-agent -ErrorAction SilentlyContinue) { throw "service still present after uninstall" }
          if (Test-Path "$cfgDir\config.json") { throw "config.json still present after uninstall" }
          if (Test-Path $src) { throw "event log source still present after uninstall" }
          Write-Host "Smoke test passed."

      - name: Upload MSI logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msi-smoke-logs
          path: msi-*.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/bin/certkit-agent_windows_amd64.exe
            dist/msi/certkit-agent_windows_amd64.msi
          if-no-files-found: error

  # Assembles the final asset set (signed exe replaces the unsigned one),
  # generates checksums over the final bytes, and publishes the release.
  release:
    runs-on: ubuntu-latest
    needs: [build, package-windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/bin

      - uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: windows-package

      - name: Assemble release files
        run: |
          mkdir -p dist/msi
          cp windows-package/bin/certkit-agent_windows_amd64.exe dist/bin/certkit-agent_windows_amd64.exe
          cp windows-package/msi/certkit-agent_windows_amd64.msi dist/msi/certkit-agent_windows_amd64.msi
          # Checksums over the final (possibly signed) bytes; bare filenames,
          # as install scripts match on them.
          (cd dist/bin && sha256sum *) > dist/certkit-agent_SHA256SUMS.txt
          (cd dist/msi && sha256sum *) >> dist/certkit-agent_SHA256SUMS.txt
          cat dist/certkit-agent_SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bin/*
            dist/msi/*
            dist/*.txt
          generate_release_notes: true

  docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/setup-qemu-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set build metadata
        run: |
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
          echo "BUILD_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ env.BUILD_COMMIT }}
            DATE=${{ env.BUILD_DATE }}
